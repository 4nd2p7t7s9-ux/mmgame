<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리 집</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--main:#f2c14e;--main-d:#d9902a;--main-l:#fff6dc;--ink:#4a3526;--cream:#fffdf7;--sub:#9a8266}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background-color:#fbe9b7;background-image:radial-gradient(circle at 18px 18px,#fff 0 3px,transparent 4px),radial-gradient(circle at 58px 52px,#f4d48a 0 5px,transparent 6px);background-size:80px 80px;color:var(--ink);font-family:"Noto Sans KR","Noto Sans TC",sans-serif;display:flex;padding:16px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.lang-ko{word-break:keep-all}
body.lang-ko .lz{display:none}
body.lang-zh .lk{display:none}
.win{margin:auto;width:100%;max-width:440px;background:var(--cream);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.bar{background:var(--main);font-family:"Press Start 2P",monospace;font-size:8px;color:var(--ink);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--ink)}
.bar button,.bar a{background:#fff;color:var(--ink);border:2px solid var(--ink);font:inherit;font-size:8px;padding:4px 6px;cursor:pointer;text-decoration:none}
.stage{border-bottom:4px solid var(--ink);line-height:0}
.stage svg{width:100%;height:auto;display:block}
.f{cursor:pointer}
.f.new{animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.info{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--main-l);border-bottom:4px solid var(--ink);font-size:13px;font-weight:900}
.info .n{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--main-d)}
.box{padding:14px 14px 16px;min-height:150px}
.tag{display:inline-block;background:var(--ink);color:#fff;font-family:"Press Start 2P",monospace;font-size:8px;padding:5px 7px;margin-bottom:8px}
.line{font-size:15px;line-height:1.6;font-weight:700}
.sub{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.lv{border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:#fff;padding:8px 4px 6px;font:inherit;color:var(--ink);text-align:center;cursor:pointer;line-height:1.3}
.lv:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lv b{display:block;font-size:22px;font-weight:400;line-height:1.2}
.lv span{font-size:11px;font-weight:900}
.lv i{display:block;font-style:normal;font-size:10px;color:var(--main-d);letter-spacing:1px;height:14px}
.lv:disabled{background:#f1ece2;color:#b5a892;border-color:#cfc4b0;box-shadow:none;cursor:default}
.lv:disabled b{filter:grayscale(1);opacity:.45}
.lv.next{background:var(--main)}
.grid{display:grid;gap:8px;margin:4px auto 0}
.card{aspect-ratio:3/4;border:3px solid var(--ink);background:var(--main);box-shadow:2px 2px 0 var(--ink);font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:transparent;background-image:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,255,255,.35) 6px 12px)}
.card{overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover;display:none}
.card.up img,.card.ok img{display:block}
.card.ok img{opacity:.55}
.card.up{background:#fff;color:inherit;background-image:none}
.card.ok{background:var(--main-l);border-color:var(--main-d);box-shadow:none;background-image:none;color:inherit}
.btn{background:var(--main-d);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:"Press Start 2P",monospace;font-size:10px;padding:10px 12px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff;color:var(--ink)}
.btn .lk,.btn .lz{font-family:"Noto Sans KR","Noto Sans TC",sans-serif;font-weight:900;font-size:13px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.talk{display:flex;gap:12px;align-items:center;min-height:170px}
.talk.r{flex-direction:row-reverse}
.talk img{height:165px;flex:none}
.bub{position:relative;margin:4px;background:#fff;box-shadow:0 -4px 0 var(--ink),0 4px 0 var(--ink),-4px 0 0 var(--ink),4px 0 0 var(--ink),inset 0 0 0 3px #f3e6c4;padding:8px 10px;font-size:13.5px;line-height:1.5;font-weight:700}
.stars{font-size:22px;letter-spacing:4px;color:var(--main-d);margin-bottom:6px}
[hidden]{display:none !important}
</style>
</head>
<body class="lang-ko">
<div class="win">
  <div class="bar"><a href="../" onclick="if(window.parent!==window){window.parent.postMessage('mm-home','*');return false}">◀ HOME</a><span>OUR HOME</span><span style="display:flex;gap:6px"><button id="mmSnd" type="button" hidden>♪ ON</button><button id="langBtn" type="button">KO</button></span></div>
  <div class="stage">
    <svg viewBox="0 0 420 312" xmlns="http://www.w3.org/2000/svg" id="room" stroke="#4a3526" stroke-width="1.6" stroke-linejoin="round"></svg>
  </div>
  <div class="info"><span id="infoL"></span><span class="n" id="infoR"></span></div>
  <div class="box" id="box"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const noDot = t => t.replace(/([^.…])\.\s+(?=\S)/g, '$1<br>').replace(/([^.…])\.(?=$|」|<)/g, '$1');   // 韓文不加句點
const L = (ko, zh) => `<span class="lk">${noDot(ko)}</span><span class="lz">${zh}</span>`;

// ============ 資料 ============
// 關卡：[家具 id, 圖示, 韓文名, 中文名, 幾對牌, 三星送的小擺飾 id]
const LEVELS = [
  ['bed', '🛏️', '더블 침대', '雙人床', 2, null],
  ['sofa', '🛋️', '소파', '沙發', 3, 'plant'],
  ['table', '🍽️', '식탁', '餐桌', 4, 'mugs'],
  ['fridge', '🧊', '냉장고', '冰箱', 4, 'magnet'],
  ['tv', '📺', 'TV', '電視', 5, null],
  ['closet', '🚪', '옷장', '衣櫃', 5, null],
  ['desk', '💡', '책상', '書桌', 6, 'frame'],
  ['ball', '⚽', '축구공', '足球', 6, null],
  ['cushion', '🧸', '쿠션', '抱枕', 8, 'book'],
];
const DECO = { plant: ['해바라기', '向日葵'], mugs: ['커플 머그컵', '成對的馬克杯'], magnet: ['냉장고 메모', '冰箱便條紙'], frame: ['사진 액자', '合照相框'], book: ['심리학 책', '心理學課本'] };
// 牌組：1~9 是服裝系列（img/s編號h.jpg 是熏熏、img/s編號m.jpg 是財財），要翻出同一套衣服的兩個人。
// 系列不夠時用表情符號補，那種是兩張一樣的。
const SERIES = [1, 2, 3, 4, 5, 6, 7, 8, 9];
// 對話：h=熏熏 m=財財 n=旁白
const TALK = {
  intro: [['n', '후후와 만재는 같은 대학교 심리학과에 합격했다.', '熏熏和財財考上了同所大學的心理系。'], ['n', '그리고 같이 살기로 했다.', '兩個人決定一起住。'], ['h', '……아무것도 없네.', '……什麼都沒有耶。'], ['m', '같이 사자.', '一起買吧。']],
  bed: [['h', '침대 왔다! 근데 하나뿐인데, 괜찮아?', '床來了！可是只有一張，沒關係嗎？'], ['m', '……괜찮아.', '……沒關係。'], ['h', '난 벽 쪽!', '我要睡靠牆那邊！']],
  sofa: [['m', '난 소파에서 자도 되는데.', '我睡沙發也可以。'], ['h', '안 돼, 내가 소파에서 잘게.', '不行，我睡沙發。'], ['n', '결국 둘이 같이 소파에서 잤다.', '結果兩個人一起睡沙發了。']],
  table: [['h', '드디어 바닥에서 안 먹어도 돼!', '終於不用坐在地上吃飯了！'], ['m', '의자는 두 개면 돼.', '兩張椅子就好。']],
  fridge: [['h', '안에 뭐 넣을까?', '裡面要放什麼？'], ['m', '아이스크림.', '冰淇淋。'], ['h', '난 삼겹살 넣을래!', '我要放五花肉！']],
  tv: [['m', '오늘 영화 볼래?', '今天要看電影嗎？'], ['h', '……끝까지 볼 수 있어?', '……你能看到最後嗎？'], ['n', '만재는 30분 만에 잠들었다.', '財財三十分鐘就睡著了。']],
  closet: [['m', '이거 내 옷 아닌 것 같은데?', '這件好像不是我的衣服吧？'], ['h', '내 거야. 헤헤.', '是我的。嘿嘿。']],
  desk: [['m', '과제 해야 돼.', '我要寫作業。'], ['h', '나도 할래!', '我也要！'], ['n', '스탠드는 새벽까지 켜져 있었다.', '檯燈一直亮到凌晨。']],
  ball: [['n', '만재의 축구공. 방 구석에 놓았다.', '財財的足球。放在房間角落。'], ['h', '주말에 같이 차러 가자.', '週末一起去踢吧。'], ['m', '……응.', '……嗯。']],
  cushion: [['h', '토끼는 내 거, 강아지는 만재 거!', '兔子是我的，狗狗是財財的！'], ['m', '근데 네가 강아지 들고 있잖아……', '可是你拿著狗狗……'], ['n', '이제 정말 집 같다.', '現在真的像家了。']],
  plant: [['h', '물은 내가 줄게.', '水我來澆。']],
  mugs: [['m', '분홍색이 네 거.', '粉紅色是你的。']],
  magnet: [['n', '「냉장고에 밥 있어. 데우기만 하면 돼. 꼭 챙겨 먹어!! — 후후」', '「冰箱已經有飯了，加熱就好，一定要記得吃飯！！ — 熏熏」']],
  frame: [['n', '같이 축구 경기 보러 가서 찍은 그 사진이다.', '是一起去看足球比賽拍的那張照片。']],
  book: [['h', '책 제목이 「회피형 인격」이래.', '課本名稱是迴避型人格。'], ['m', '……나로 과제 하지 마.', '……不要拿我當作業。']],
  end: [['n', '다음 주는 중간고사다.', '下週期中考。'], ['h', '만재야, 나 아직 내 연구 대상을 잘 모르겠어.', '財財，我現在還沒搞懂我的研究對象。'], ['m', '응? 왜?', '嗯？為什麼？'],
    ['h', '우선…… 침착한 듯하다.', '首先……看起來很冷靜。'], ['h', '강아지인가……?', '是小狗嗎……？'], ['h', '예의가 굉장히 바르다.', '非常有禮貌。'], ['h', '가까이 손을 뻗으니…… 예상치 못한!', '一伸手靠近……出乎意料！'], ['m', '나야……?', '是我嗎……？']],
};

// ============ 狀態 ============
let stars = Array(LEVELS.length).fill(0), deco = {}, seenIntro = false, seenEnd = false;
try { const d = JSON.parse(localStorage.getItem('mm-home') || 'null'); if (d) ({ stars, deco, seenIntro, seenEnd } = d); } catch (e) {}
const save = () => { try { localStorage.setItem('mm-home', JSON.stringify({ stars, deco, seenIntro, seenEnd })); } catch (e) {} };
const owned = () => stars.filter(s => s > 0).length;

function renderRoom(fresh) {
  document.querySelectorAll('#room .f').forEach(g => {
    const id = g.dataset.f, i = LEVELS.findIndex(l => l[0] === id);
    g.toggleAttribute('hidden', !(i >= 0 ? stars[i] > 0 : deco[id]));
    g.classList.toggle('new', !!fresh && fresh.includes(id));
  });
}
function info(l, r) { $('infoL').innerHTML = l; $('infoR').textContent = r; }

// ============ 對話 ============
function say(lines, done) {
  let i = 0;
  const draw = () => {
    const [w, ko, zh] = lines[i];
    $('box').innerHTML = (w === 'n'
      ? `<div class="tag">NARRATION</div><div class="line">${L(ko, zh)}</div>`
      : `<div class="talk${w === 'm' ? ' r' : ''}"><img src="img/${w === 'h' ? 'hu' : 'mi'}.png" alt=""><div class="bub">${L(ko, zh)}</div></div>`)
      + `<div class="row"><button class="btn" id="nx" type="button">NEXT ▶</button></div>`;
    $('nx').onclick = () => { if (++i < lines.length) draw(); else done(); };
  };
  draw();
}

// ============ 主畫面 ============
function home(fresh) {
  renderRoom(fresh);
  info(L('우리 집', '我們的家'), `${owned()}/${LEVELS.length}`);
  const next = stars.findIndex(s => !s);
  $('box').innerHTML = `<div class="tag">STAGE</div><div class="line">${next < 0 ? L('가구를 다 모았어요! 다시 도전해서 ★3개를 노려 보세요.', '家具全部收齊了！可以再挑戰拿三顆星。') : L('같은 옷을 입은 두 사람을 찾아 가구를 얻으세요.', '翻出穿同一套衣服的兩個人，贏得家具。')}</div>
    <div class="levels">${LEVELS.map((l, i) => `<button class="lv${i === next ? ' next' : ''}" data-i="${i}" type="button"${next >= 0 && i > next ? ' disabled' : ''}><b>${l[1]}</b><span>${L(l[2], l[3])}</span><i>${'★'.repeat(stars[i])}${'☆'.repeat(stars[i] ? 3 - stars[i] : 0)}</i></button>`).join('')}</div>
    <div class="sub">${L('★3개로 깨면 작은 소품을 더 받아요. 방 안의 가구를 눌러 보세요.', '三顆星過關會多送小擺飾。房間裡的家具可以點點看。')}</div>`;
  $('box').querySelectorAll('.lv').forEach(b => b.onclick = () => play(+b.dataset.i));
}

// ============ 翻牌 ============
function play(n) {
  const [id, icon, ko, zh, pairs] = LEVELS[n];
  const s3 = pairs * 2, s2 = pairs * 2 + 3, limit = pairs * 3 + 4;
  const cols = pairs === 2 ? 2 : pairs === 3 ? 3 : pairs === 5 ? 5 : 4;
  const pick = SERIES.filter(x => typeof x === 'number').sort(() => Math.random() - .5).concat(SERIES.filter(x => typeof x !== 'number')).slice(0, pairs);
  const deck = pick.flatMap(k => typeof k === 'number' ? [[k, `<img src="img/s${k}h.jpg" alt="">`], [k, `<img src="img/s${k}m.jpg" alt="">`]] : [[k, k], [k, k]]).sort(() => Math.random() - .5);
  let open = [], done = 0, moves = 0, lock = true;
  const head = () => info(`${icon} ${L(ko, zh)}`, `${moves}/${limit}`);
  head();
  $('box').innerHTML = `<div class="grid" style="grid-template-columns:repeat(${cols},1fr);max-width:${cols * (cols < 4 ? 92 : 72)}px">${deck.map((f, i) => `<button class="card up" data-f="${f[0]}" type="button">${f[1]}</button>`).join('')}</div>
    <div class="sub"><b>${L('카드 위치를 먼저 외우고, 같은 시리즈 옷을 입은 후후와 만재를 짝지으세요.', '先記住牌的位置，把穿同一系列衣服的熏熏和財財配成一對。')}</b><br>${L(`${s3}번 안에 깨면 ★★★ · ${limit}번을 넘기면 실패`, `${s3} 步內過關 ★★★・超過 ${limit} 步失敗`)}</div>
    <div class="row"><button class="btn ghost" id="quit" type="button">◀ BACK</button><button class="btn" id="ready" type="button">START!</button></div>`;
  const cards = [...$('box').querySelectorAll('.card')];
  $('ready').onclick = () => { cards.forEach(c => c.classList.remove('up')); lock = false; $('ready').hidden = true; };
  $('quit').onclick = () => home();
  cards.forEach(c => c.onclick = () => {
    if (lock || c.classList.contains('up') || c.classList.contains('ok')) return;
    c.classList.add('up'); open.push(c);
    if (open.length < 2) return;
    moves++; head();
    const [a, b] = open; open = [];
    if (a.dataset.f === b.dataset.f) {
      a.classList.add('ok'); b.classList.add('ok');
      if (++done === pairs) return setTimeout(() => win(n, moves <= s3 ? 3 : moves <= s2 ? 2 : 1), 500);
    } else { lock = true; setTimeout(() => { a.classList.remove('up'); b.classList.remove('up'); lock = false; }, 650); }
    if (moves >= limit) { lock = true; setTimeout(() => lose(n), 700); }
  });
}
function lose(n) {
  $('box').innerHTML = `<div class="tag">FAILED</div><div class="line">${L('횟수를 다 썼어요. 다시 해 볼까요?', '步數用完了。要再試一次嗎？')}</div>
    <div class="row"><button class="btn ghost" id="b" type="button">◀ BACK</button><button class="btn" id="r" type="button">RETRY</button></div>`;
  $('b').onclick = () => home(); $('r').onclick = () => play(n);
}
function win(n, st) {
  const [id, icon, ko, zh, , gift] = LEVELS[n];
  const first = !stars[n], fresh = [];
  stars[n] = Math.max(stars[n], st);
  if (first) fresh.push(id);
  const newGift = st === 3 && gift && !deco[gift];
  if (newGift) { deco[gift] = 1; fresh.push(gift); }
  save(); renderRoom(fresh); info(`${icon} ${L(ko, zh)}`, 'CLEAR');
  $('box').innerHTML = `<div class="tag">CLEAR</div><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div>
    <div class="line">${first ? L(`「${ko}」을(를) 얻었어요!`, `得到「${zh}」了！`) : L('다시 깼어요!', '再次過關！')}</div>
    <div class="row"><button class="btn" id="nx" type="button">NEXT ▶</button></div>`;
  $('nx').onclick = () => {
    const after = () => (owned() === LEVELS.length && !seenEnd) ? (seenEnd = true, save(), say(TALK.end, () => home())) : home();
    // 三顆星：先顯示「額外禮物」，再出現那個禮物的對話
    const giftStep = () => {
      if (!newGift) return after();
      $('box').innerHTML = `<div class="tag">GIFT</div><div class="stars">★★★</div><div class="line">${L(`추가 선물: 「${DECO[gift][0]}」`, `額外禮物：「${DECO[gift][1]}」`)}</div>
        <div class="row"><button class="btn" id="nx" type="button">NEXT ▶</button></div>`;
      $('nx').onclick = () => say(TALK[gift], after);
    };
    first ? say(TALK[id], giftStep) : giftStep();
  };
}

$('room').addEventListener('click', e => { const g = e.target.closest('.f'); if (g && $('box').querySelector('.levels')) say(TALK[g.dataset.f].slice(-2), () => home()); });
$('langBtn').onclick = function () { const zh = document.body.className === 'lang-ko'; document.body.className = zh ? 'lang-zh' : 'lang-ko'; this.textContent = zh ? '中' : 'KO'; };

// ============ 房間（45 度角，全部用方塊組成） ============
const P = (x, y, z = 0) => [210 + (x - y) * 18, 120 + (x + y) * 9 - z * 18];
const pg = (pts, fill, extra = '') => `<polygon points="${pts.map(p => P(...p).map(n => n.toFixed(1)).join(',')).join(' ')}" fill="${fill}" ${extra}/>`;
const shade = (hex, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0')).join('');
// 方塊：位置 x,y,z、寬 w、深 d、高 h、顏色；fy/fx 可以另外指定兩個側面的顏色
function bx(x, y, z, w, d, h, c, o = {}) {
  return pg([[x, y + d, z + h], [x + w, y + d, z + h], [x + w, y + d, z], [x, y + d, z]], o.fy || shade(c, .88))
    + pg([[x + w, y, z + h], [x + w, y + d, z + h], [x + w, y + d, z], [x + w, y, z]], o.fx || shade(c, .76))
    + pg([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], c);
}

(function () {
  if (window.parent === window) return;
  const b = document.getElementById('mmSnd');
  b.hidden = false;
  b.addEventListener('click', e => { e.stopImmediatePropagation(); window.parent.postMessage('mm-snd-toggle', '*'); }, true);
  window.addEventListener('message', e => { if (e.data && e.data.mmSnd !== undefined) { b.textContent = e.data.mmSnd ? '♪ ON' : '♪ OFF'; b.classList.toggle('off', !e.data.mmSnd); } });
  window.parent.postMessage('mm-snd-state', '*');
})();
